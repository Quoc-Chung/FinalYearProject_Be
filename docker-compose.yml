version: '3.8'

services:
  backend:
    image: quocchung/techcycle-backend:latest
    container_name: techcycle-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Database
      - DB_URL=jdbc:mysql://mysql:3306/techcycle_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
      # Mail
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      # Google OAuth2
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # Facebook OAuth2
      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      # MinIO
      - MINIO_ENDPOINT=http://minio:9000          # internal: để backend upload/delete
      - MINIO_PUBLIC_ENDPOINT=https://techcycleit.duckdns.org/minio
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      # Frontend
      - FRONTEND_URL=${FRONTEND_URL}
      - FRONTEND_RESET_PASSWORD_URL=${FRONTEND_RESET_PASSWORD_URL}
    depends_on:
      - mysql
      - redis
    networks:
      - techcycle-net

  mysql:
    image: mysql:8.0
    container_name: techcycle-mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=techcycle_system
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - techcycle-net

  redis:
    image: redis:7-alpine
    container_name: techcycle-redis
    restart: always
    networks:
      - techcycle-net

  minio:
    image: minio/minio
    container_name: techcycle-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - techcycle-net
  mc-init:
    image: minio/mc
    container_name: techcycle-mc-init
    depends_on:
      - minio
    networks:
      - techcycle-net
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
      mc mb --ignore-existing local/$$MINIO_BUCKET_NAME &&
      mc anonymous set download local/$$MINIO_BUCKET_NAME &&
      mc cors set --allow-origin 'https://techcycleit.duckdns.org' --allow-method 'PUT,GET,HEAD,DELETE' --allow-header '*' local/$$MINIO_BUCKET_NAME &&
      echo 'MinIO CORS configured' &&
      exit 0
      "
    restart: "no"
  frontend:
    image: quocchung/techcycle-frontend:latest
    container_name: techcycle-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - techcycle-net

volumes:
  mysql_data:
  minio_data:

networks:
  techcycle-net:
    driver: bridge

