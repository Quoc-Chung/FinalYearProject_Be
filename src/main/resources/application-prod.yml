spring:
  messages:
    encoding: UTF-8
  datasource:
    url: jdbc:mysql://prod-host:3306/techcycle_system
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            scope: email,profile
            client-name: Google

          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            redirect-uri: ${FACEBOOK_REDIRECT_URI}
            scope: email,public_profile
            client-name: Facebook

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
            user-name-attribute: id

          facebook:
            authorization-uri: https://www.facebook.com/v12.0/dialog/oauth
            token-uri: https://graph.facebook.com/v12.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email
            user-name-attribute: id
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:120MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:130MB}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.quocchung.cntt1.techcycle_system.model

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

auth:
  refresh-cookie-name: refreshToken
  refresh-cookie-secure: true
  refresh-cookie-same-site: Strict
  refresh-cookie-path: /
  reset-password-token-ttl-seconds: ${RESET_PASSWORD_TOKEN_TTL_SECONDS:900}
  forgot-password-rate-limit:
    window-seconds: ${FORGOT_PASSWORD_LIMIT_WINDOW_SECONDS:900}
    email-max-attempts: ${FORGOT_PASSWORD_EMAIL_MAX_ATTEMPTS:3}
    ip-max-attempts: ${FORGOT_PASSWORD_IP_MAX_ATTEMPTS:10}

app:
  frontend-reset-password-url: ${FRONTEND_RESET_PASSWORD_URL}

minio:
  enabled: true
  endpoint: ${MINIO_ENDPOINT}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT}}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME:techcycle}
  post-image-max-size-bytes: ${MINIO_POST_IMAGE_MAX_SIZE_BYTES:10485760}
  post-video-max-size-bytes: ${MINIO_POST_VIDEO_MAX_SIZE_BYTES:104857600}