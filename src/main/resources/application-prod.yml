spring:
  messages:
    encoding: UTF-8

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/techcycle_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  mail:
    host: smtp.gmail.com
    port: 587
    username: tuquocchung@gmail.com
    password: foelaoxyhawnkthh
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  security:
    oauth2:
      client:
        registration:

          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "https://techcycleit.duckdns.org/api/auth/google/callback"
            scope: email,profile
            client-name: Google

          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            redirect-uri: "https://techcycleit.duckdns.org/api/auth/facebook/callback"
            scope: public_profile
            client-name: Facebook

        provider:

          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
            user-name-attribute: id

          facebook:
            authorization-uri: https://www.facebook.com/v12.0/dialog/oauth
            token-uri: https://graph.facebook.com/v12.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email
            user-name-attribute: id

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 120MB
      max-request-size: 130MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.quocchung.cntt1.techcycle_system.model

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 9000000000
  refresh-token-expiration: 60480000000

auth:
  refresh-cookie-name: refreshToken
  refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  refresh-cookie-same-site: Lax
  refresh-cookie-path: /

forgot-password:
  reset-password-token-ttl-seconds: 900
  forgot-password-rate-limit:
    window-seconds: 900
    email-max-attempts: 3
    ip-max-attempts: 10
  frontend-reset-password-url: ${FRONTEND_RESET_PASSWORD_URL:https://techcycleit.duckdns.org/reset-password}

minio:
  enabled: ${MINIO_ENABLED:true}
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:https://techcycleit.duckdns.org/minio}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME:techcycle}
  post-image-max-size-bytes: 10485760
  post-video-max-size-bytes: 104857600

logging:
  level:
    org:
      hibernate:
        SQL: ERROR
        orm:
          connections:
            pooling: ERROR

    com:
      zaxxer:
        hikari:
          HikariConfig: ERROR
          HikariDataSource: ERROR
          hikari: ERROR

frontend:
  url: ${FRONTEND_URL:https://techcycleit.duckdns.org}