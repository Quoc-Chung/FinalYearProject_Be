name: CI/CD Backend - TechCycle

on:
  push:
    branches: [ main, master, deploy ]
  pull_request:
    types: [ closed ]
    branches: [ deploy ]

env:
  DOCKERHUB_IMAGE: quocchung/techcycle-backend

jobs:
  # ============================================
  # JOB 1: BUILD & TEST
  # ============================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (skip tests)
        run: mvn clean package -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  # ============================================
  # JOB 2: DOCKER BUILD & PUSH
  # ============================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        github.ref == 'refs/heads/deploy'
      )) ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.base_ref == 'deploy')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # JOB 3: DEPLOY LÊN VPS
  # ============================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: docker
    if: |
      (github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        github.ref == 'refs/heads/deploy'
      )) ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.base_ref == 'deploy')

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ~/techcycle

            # Pull image mới nhất
            docker pull quocchung/techcycle-backend:latest

            # Restart chỉ backend container (không restart DB, Redis)
            docker-compose up -d --no-deps --force-recreate backend

            # Xóa image cũ không dùng
            docker image prune -f

            # Kiểm tra container đang chạy
            docker ps | grep techcycle-backend

            echo "✅ Deploy thành công!"